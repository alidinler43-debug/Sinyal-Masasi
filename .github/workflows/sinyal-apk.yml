name: Sinyal Masasi APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: En son yuklenen paketi ac
        run: |
          best=""; bt=0
          for f in sinyal-android*.zip; do
            [ -e "$f" ] || continue
            t=$(git log -1 --format=%ct -- "$f")
            if [ "${t:-0}" -gt "$bt" ]; then bt=$t; best="$f"; fi
          done
          echo "Kullanilan paket: $best"
          [ -n "$best" ] || { echo "HATA: sinyal-android ile baslayan zip bulunamadi"; exit 1; }
          rm -rf kaynak
          mkdir kaynak
          unzip -q "$best" -d kaynak
          test -f kaynak/app/src/main/assets/index.html || { echo "HATA: bu paket eski surum, uygulama dosyasi yok"; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: APK olustur
        working-directory: kaynak
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: APK dosyasini adlandir
        run: cp kaynak/app/build/outputs/apk/release/app-release.apk SinyalMasasi.apk
      - name: Releases sayfasina koy
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sinyal-${{ github.run_number }}
          name: Sinyal Masasi ${{ github.run_number }}
          files: SinyalMasasi.apk
