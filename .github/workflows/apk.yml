name: APK oluştur

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Projeyi aç
        run: |
          ZIP=$(find . -maxdepth 2 -iname "*.zip" | head -1)
          if [ -z "$ZIP" ]; then echo "Depoda zip dosyası yok. android-project.zip dosyasını yükle."; exit 1; fi
          echo "Kullanılan dosya: $ZIP"
          unzip -o "$ZIP" -d build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: APK derle
        working-directory: build/android-project
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: APK dosyasını adlandır
        run: cp build/android-project/app/build/outputs/apk/release/app-release.apk SinyalMasasi.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Sinyal Masası v${{ github.run_number }}
          files: SinyalMasasi.apk
